<style>
/* Immersive viewer: one full-bleed panorama, quiet dark chips on top. Deliberately single-theme (dark UI over imagery). */
:root {
  color-scheme: dark;
  --bg: #0c0d0d;
  --ink: #f2f2ef;

  --line: rgba(255, 255, 255, 0.16);

  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --safe-l: max(16px, env(safe-area-inset-left, 0px));

}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
  font: 400 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#view.dragging { cursor: grabbing; }
#view.pointing { cursor: pointer; }
#view:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
.hud { position: fixed; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto;
  padding-left: var(--safe-l); padding-right: var(--safe-r);
  padding-block: max(14px, env(safe-area-inset-top, 0px)) var(--safe-b); gap: 12px; }
.hud > * { pointer-events: auto; }
.hud > .spacer { pointer-events: none; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; pointer-events: none; }
.top > * { pointer-events: auto; }
.chip { background: var(--chip); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); }
.title { padding: 10px 14px; display: grid; gap: 2px; max-width: min(26rem, 100%); }
.title h1 { font: 400 1.55rem/1.05 var(--display); margin: 0; letter-spacing: .01em; }
.title .sub { color: var(--muted); font-size: .82rem; }
.title .here { font-size: .82rem; color: var(--accent); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
button { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 12px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
button:hover { border-color: rgba(255,255,255,.4); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body.guiding #guide { border-color: var(--accent); color: var(--accent); }
.bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.hint { padding: 8px 12px; font-size: .84rem; color: var(--muted); transition: opacity .6s; max-width: 30rem; }
.hint.gone { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .6s, visibility 0s linear .6s; }
.caption { position: fixed; left: 50%; bottom: var(--safe-b); transform: translate(-50%, 8px);
  padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 4px 14px; opacity: 0; pointer-events: none;
  visibility: hidden; transition: opacity .4s, transform .4s, visibility 0s linear .4s; max-width: calc(100% - 32px); }
.caption.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; visibility: visible; transition: opacity .4s, transform .4s; }
.caption .ct { font: italic 400 1.9rem/1 var(--display); }
.caption .cm { color: var(--muted); font-size: .86rem; }
.caption button { padding: 6px 10px; }
.map { padding: 8px; }
.map svg { display: block; width: 190px; height: auto; touch-action: manipulation; }
.map .dot, .map .work { cursor: pointer; }
.map .dot:focus, .map .work:focus { outline: none; }
.map .ring { fill: none; stroke: var(--accent); stroke-width: 1.3; pointer-events: none; }

.panel img { width: 100%; height: auto; border-radius: 3px; background: #222; display: block; }
.panel h2 { font: 400 3rem/1 var(--display); margin: 0; font-style: italic; }

.panel dt { color: var(--muted); }
.panel dd { margin: 0; font-variant-numeric: tabular-nums; }
.panel a { color: var(--accent); }
.loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); transition: opacity .5s;
  font: 400 1.4rem var(--display); color: var(--muted); padding: 24px; text-align: center; }
.loading.done { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .5s, visibility 0s linear .5s; }
.loading[role="alert"] { color: var(--ink); }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0; }
@media (max-width: 640px) {
  .title h1 { font-size: 1.25rem; }

  .caption { left: var(--safe-l); right: var(--safe-r); max-width: none; transform: translateY(8px); flex-wrap: wrap; }
  .caption.on { transform: none; }
  .caption .ct { font-size: 1.5rem; }

  .panel { top: auto; height: 78%; width: 100%; border-left: 0; border-top: 1px solid var(--line);

  .panel.open { transform: none; }

@media (max-height: 500px) {

  .title { padding: 6px 10px; }

  .caption { left: var(--safe-l); right: auto; transform: translateY(8px); max-width: calc(100% - 180px); flex-wrap: wrap; }
  .caption.on { transform: none; }
  .caption .ct { font-size: 1.4rem; }
  .panel { width: min(24rem, 62%); }

@media (prefers-reduced-motion: reduce) { .panel, .panel.open, .hint, .loading, .caption, .caption.on { transition: none; } }

    const disc = new THREE.Mesh(discGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, depthWrite: false }));

  const centre = w => [0, 1, 2].map(k => w.corners.reduce((s, p) => s + p[k], 0) / 4);
  for (const w of DATA.works) {
    const c = w.corners;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute([...c[0], ...c[1], ...c[2], ...c[0], ...c[2], ...c[3]], 3));
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
    m.userData = { work: w.id };
    const lg = new THREE.BufferGeometry().setFromPoints([...c, c[0]].map(p => new THREE.Vector3(p[0], p[1], p[2])));
    const outline = new THREE.Line(lg, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
    outline.visible = false; m.userData.outline = outline;

  // ---- view
  function setView(v) { yaw = v.yaw; pitch = v.pitch; if (v.fov) fov = v.fov; turning = null; }

  function turnTo(view, dur) {

      cursor.position.x, cursor.position.y, cursor.material.opacity, hoverWork ? hoverWork.id : 0, dotsSig,

    const visDots = [...dots.values()].filter(g => g.visible);

  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault(); stopGuide(); turning = null;

  }, { passive: false });
  canvas.addEventListener("keydown", e => {

    else if (e.key === "ArrowUp") pitch = Math.min(1.45, pitch + s); else if (e.key === "ArrowDown") pitch = Math.max(-1.45, pitch - s);

  }

  // ---- hint, fullscreen, panel

  let hintTimer = setTimeout(hideHint, 12000);

  });

    if (!w) return;
    if (!panel.classList.contains("open")) lastFocus = document.activeElement;
    pbody.innerHTML = "";
    if (w.img) {

      img.onerror = () => img.remove();

    const dl = document.createElement("dl");

      ["Stærð (h × b × d)", `${fmt(w.h)} × ${fmt(w.w)} × ${fmt(w.d)} cm`], ["Staður", E.place]];
    for (const [k, v] of rows) { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v; dl.append(dt, dd); }

  // ---- floor plan: built once; the dots and the works are buttons (click, or Tab and Enter)
  const svg = document.getElementById("mapsvg");
  const xs = R.outline.map(p => p[0]), ys = R.outline.map(p => p[1]);
  const minx = Math.min(...xs) - 0.3, maxx = Math.max(...xs) + 0.3, maxy = Math.max(...ys) + 0.3, miny = Math.min(...ys) - 0.3;

  const f2 = v => v.toFixed(2);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  (function buildMap() {
    const c = R.column;
    svg.append(el("polygon", { points: R.outline.map(p => f2(X(p[0])) + "," + f2(Y(p[1]))).join(" "), fill: "rgba(255,255,255,.06)", stroke: "rgba(255,255,255,.55)", "stroke-width": ".8" }));
    svg.append(el("line", { x1: f2(X(R.passage[0])), y1: f2(Y(R.outline[0][1])), x2: f2(X(R.passage[1])), y2: f2(Y(R.outline[0][1])), stroke: "#161818", "stroke-width": "1.6" }));
    svg.append(el("rect", { x: f2(X(c[0])), y: f2(Y(c[4])), width: f2((c[3] - c[0]) * sc), height: f2((c[4] - c[1]) * sc), fill: "rgba(255,255,255,.35)" }));
    for (const w of DATA.works) {
      const a = w.corners[0], b = w.corners[1];
      const g = el("g", { class: "work", "data-work": w.id, tabindex: "0", role: "button", "aria-label": `Verkið „${w.title}“` });
      g.append(el("line", { x1: f2(X(a[0])), y1: f2(Y(a[1])), x2: f2(X(b[0])), y2: f2(Y(b[1])), stroke: "transparent", "stroke-width": "7" }));
      g.append(el("line", { x1: f2(X(a[0])), y1: f2(Y(a[1])), x2: f2(X(b[0])), y2: f2(Y(b[1])), stroke: "#f3e6d6", "stroke-width": "2.2" }));
      const t = el("title", {}); t.textContent = w.title; g.append(t);
      svg.append(g);
    }
    svg.append(el("path", { id: "cone", fill: "rgba(243,230,214,.35)" }));
    for (const n of DATA.nodes) {
      const d = el("circle", { class: "dot", "data-id": n.id, cx: f2(X(n.x)), cy: f2(Y(n.y)), r: 2, fill: "rgba(255,255,255,.75)", stroke: "#111",
        "stroke-width": ".5", tabindex: "0", role: "button", "aria-label": "Ganga að: " + n.name });
      const t = el("title", {}); t.textContent = n.name; d.append(t);
      svg.append(d);
    }
    svg.append(el("circle", { id: "ring", class: "ring", r: 4.2, cx: -10, cy: -10, visibility: "hidden" }));
  })();
  const cone = svg.querySelector("#cone"), ring = svg.querySelector("#ring");
  function drawMap() {
    const a0 = yaw, fw = (fov * Math.PI / 180) * 0.6, r = 9;
    const cx = cur.x, cy = cur.y;
    const p1 = [cx + Math.cos(a0 + fw) * r / sc, cy + Math.sin(a0 + fw) * r / sc], p2 = [cx + Math.cos(a0 - fw) * r / sc, cy + Math.sin(a0 - fw) * r / sc];
    cone.setAttribute("d", `M${f2(X(cx))},${f2(Y(cy))} L${f2(X(p1[0]))},${f2(Y(p1[1]))} L${f2(X(p2[0]))},${f2(Y(p2[1]))} Z`);
    for (const c of svg.querySelectorAll("circle.dot")) {
      const on = c.getAttribute("data-id") === cur.id;
      c.setAttribute("r", on ? 2.6 : 2);
      c.setAttribute("fill", on ? "#f3e6d6" : "rgba(255,255,255,.75)");
      if (on) c.setAttribute("aria-current", "location"); else c.removeAttribute("aria-current");
    }
  }
  // walk to a work: to the viewpoint the guided walk uses for it, turned to frame it, then its information
  function showWork(id) {
    stopGuide();
    const st = (DATA.guided || []).find(s => s.work === id);
    if (!st || !NODES.has(st.node)) { openWork(id); return; }
    const view = viewOf(st);
    if (st.node === cur.id) { turnTo(view, 900); setTimeout(() => openWork(id), RM() ? 0 : 900); }
    else go(st.node, { view, done: () => openWork(id) }).then(ok => { if (!ok && !moving && !pending) openWork(id); });
  }
  // a click picks the nearest viewpoint within 14 px (the dots are small and close together on a phone)
  svg.addEventListener("click", e => {
    const wg = e.target.closest && e.target.closest(".work");
    if (wg) { showWork(wg.getAttribute("data-work")); return; }
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * 100, py = (e.clientY - r.top) / r.height * H;
    let best = null, bd = 14 / (r.width / 100);
    for (const n of DATA.nodes) {
      const d = Math.hypot(X(n.x) - px, Y(n.y) - py);
      if (d < bd) { bd = d; best = n.id; }
    }
    if (best) { stopGuide(); go(best); }
  });
  svg.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const wg = e.target.closest && e.target.closest(".work");
    const id = e.target.getAttribute && e.target.getAttribute("data-id");
    if (wg) { e.preventDefault(); showWork(wg.getAttribute("data-work")); }
    else if (id) { e.preventDefault(); stopGuide(); go(id); }
  });
  svg.addEventListener("focusin", e => {
    const t = e.target;
    if (t.classList && t.classList.contains("dot")) {
      ring.setAttribute("cx", t.getAttribute("cx")); ring.setAttribute("cy", t.getAttribute("cy"));
      ring.setAttribute("visibility", "visible");
    } else if (t.classList && t.classList.contains("work")) {
      t.querySelector("line:last-of-type").setAttribute("stroke-width", "4");
    }
  });
  svg.addEventListener("focusout", e => {
    ring.setAttribute("visibility", "hidden");
    const t = e.target;
    if (t.classList && t.classList.contains("work")) t.querySelector("line:last-of-type").setAttribute("stroke-width", "2.2");
  });
  let lastMap = "";
  setInterval(() => {
    const k = `${yaw.toFixed(2)},${fov.toFixed(0)},${cur.id}`;
    if (k !== lastMap) { lastMap = k; drawMap(); }
  }, 120);
  const mapBox = document.getElementById("map"), mapToggle = document.getElementById("mapToggle");
  mapToggle.addEventListener("click", () => {
    const closed = mapBox.classList.toggle("closed");
    mapToggle.textContent = closed ? "+" : "–";
    mapToggle.setAttribute("aria-expanded", String(!closed));
    mapToggle.setAttribute("aria-label", closed ? "Sýna grunnmynd" : "Fela grunnmynd");
  });

  // ---- guided walk: viewpoint to viewpoint, turning to each work (survey/tour.json -> guided)
  const guideBtn = document.getElementById("guide"), caption = document.getElementById("caption");
  function viewOf(st) {
    const n = NODES.get(st.node);
    if (!st.work) return { yaw: (st.look_deg ?? n.look ?? 90) * Math.PI / 180, pitch: -0.05, fov: 72 };
    const w = WORKS.get(st.work), c = centre(w);
    const dx = c[0] - n.x, dy = c[1] - n.y, dz = c[2] - EYE, dh = Math.hypot(dx, dy), d = Math.hypot(dh, dz);
    // the work at about half the screen height and at most 80 % of its width, whatever the screen's shape
    const aspect = Math.max(0.3, canvas.clientWidth / Math.max(1, canvas.clientHeight));
    const vh = 2 * Math.atan(w.h / 100 / 0.5 / 2 / d);
    const hw = 2 * Math.atan(w.w / 100 / 0.8 / 2 / d);
    const vw = 2 * Math.atan(Math.tan(hw / 2) / aspect);
    const f = Math.max(vh, vw) * 180 / Math.PI;
    return { yaw: Math.atan2(dy, dx), pitch: Math.atan2(dz, dh), fov: Math.max(34, Math.min(95, f)) };
  }
  function showCaption(st) {
    caption.innerHTML = "";
    if (st.work) {
      const w = WORKS.get(st.work);
      const t = document.createElement("div"); t.className = "ct"; t.textContent = w.title;
      const m = document.createElement("div"); m.className = "cm";
      m.textContent = `${DATA.exhibition.artist}, ${w.year} · ${fmt(w.h)} × ${fmt(w.w)} cm`;
      const b = document.createElement("button"); b.type = "button"; b.textContent = "Nánar";
      b.setAttribute("aria-label", `Nánar um verkið „${w.title}“`);
      b.addEventListener("click", () => { stopGuide(); openWork(w.id); });
      caption.append(t, m, b);
    } else {
      const t = document.createElement("div"); t.className = "cm"; t.textContent = NODES.get(st.node).name;
      caption.append(t);
    }
    caption.classList.add("on");
  }
  // every callback of a run checks that its run is still the current one (a stop and a restart start a new run)
  function arm(g) {
    clearTimeout(g.timer);
    if (!g.paused && g.next) g.timer = setTimeout(() => { if (guide === g) g.next(); }, g.hold);
  }
  function guideStep(g, i) {
    if (guide !== g) return;
    const st = DATA.guided[i];
    if (!st) { stopGuide(); say("Leiðsögn lokið."); return; }
    g.i = i; g.next = null;
    caption.classList.remove("on");
    const view = viewOf(st);
    const settle = () => {
      if (guide !== g) return;
      showCaption(st);
      const next = DATA.guided[i + 1];
      if (next) load(next.node, true).catch(() => {});
      g.next = () => guideStep(g, i + 1);
      g.hold = st.work ? 6500 : 4000;
      arm(g);
    };
    if (st.node !== cur.id) {
      go(st.node, { view, done: settle, run: g }).then(ok => { if (!ok && guide === g && !moving && !pending) stopGuide(); });
    } else {
      turnTo(view, 1500);
      clearTimeout(g.timer);
      g.timer = setTimeout(settle, RM() ? 100 : 1500);
    }
  }
  function startGuide() {
    if (!DATA.guided || !DATA.guided.length) return;
    closeWork(); hideHint();
    const g = guide = { i: 0, timer: null, paused: false, next: null, hold: 0 };
    guideBtn.textContent = "Stöðva leiðsögn";
    document.body.classList.add("guiding");
    whenIdle(() => {           // a walk already under way ends first
      if (guide !== g) return;
      let k = DATA.guided.findIndex(st => st.node === cur.id);
      if (k < 0) k = DATA.guided.findIndex(st => cur.links.includes(st.node));
      guideStep(g, Math.max(0, k));
    });
  }
  function stopGuide() {
    if (!guide) return;
    const g = guide;
    clearTimeout(g.timer); guide = null;
    if (moving && moving.run === g) moving.done = null;
    caption.classList.remove("on");
    guideBtn.textContent = "Leiðsögn";
    document.body.classList.remove("guiding");
  }
  // reading the caption (or tabbing to 'Nánar') holds the walk; leaving it goes on after a short pause
  caption.addEventListener("focusin", () => { if (guide) { guide.paused = true; clearTimeout(guide.timer); } });
  caption.addEventListener("focusout", () => { if (guide) { guide.paused = false; guide.hold = 3000; arm(guide); } });
  guideBtn.addEventListener("click", () => guide ? stopGuide() : startGuide());
  if (!DATA.guided || !DATA.guided.length) guideBtn.hidden = true;

  // ---- start
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    forceRender = true;
  }
  window.addEventListener("resize", resize);
  resize();
  updateDots();
  arrive(cur).then(() => {
    loadingEl.classList.add("done");
    forceRender = true;
  }).catch(() => fatal("Ekki tókst að hlaða myndunum."));
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
